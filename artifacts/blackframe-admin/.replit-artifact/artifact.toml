kind = "web"
previewPath = "/"
title = "BLACK FRAME MOBILE — Admin"
version = "1.0.0"
id = "artifacts/blackframe-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23822

[services.development]
run = "pnpm --filter @workspace/blackframe-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blackframe-admin", "run", "build" ]
publicDir = "artifacts/blackframe-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23822"
BASE_PATH = "/"
